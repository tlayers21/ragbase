[project]
name = "ragbase"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.0.0",
    "json-repair>=0.30.0",
    "paddleocr>=3.7.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.9",
    "dspy>=2.0.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "rank-bm25>=0.2.2",
    "pdf2image>=1.16.0",
    "pillow>=10.0.0",
    "docling>=2.0.0",
    "openai-whisper>=20230918",
    "yt-dlp>=2023.0.0",
    "ollama>=0.1.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "huggingface-hub>=0.16.0,<1.0",
    "sentence-transformers>=2.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.24.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["api", "analysis", "config", "ingestion", "ml", "retrieval", "utils"]

[tool.setuptools.packages.find]
include = ["api*", "config*", "ingestion*", "retrieval*", "analysis*", "utils*", "ml*"]
exclude = ["frontend*", "data*", "logs*", "scripts*", "docs*"]
